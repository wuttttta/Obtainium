name: Push fork - sync, build and release

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        description: Release even if nothing changed since the last release
  push:
    branches: [ "push" ]

permissions:
  contents: write

concurrency:
  group: push-fork-${{ github.event_name == 'push' && github.sha || 'release' }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/ImranR98/Obtainium.git
  MERGE_MESSAGE: Merge upstream/main into push
  APP_ID_SUFFIX: .push
  APP_LABEL: Obtainium Push
  KEY_ALIAS: obtainium-push
  SIGNER_SHA256: 118b0cd01c6055008ca3f35b3ba194122029cdf76a9fdfbdd0f073dea1346376

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Check secrets
        env:
          SYNC_DEPLOY_KEY: ${{ secrets.SYNC_DEPLOY_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          missing=""
          [ -n "$SYNC_DEPLOY_KEY" ] || missing="$missing SYNC_DEPLOY_KEY"
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these repository secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: push
          fetch-depth: 0
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Sync main with upstream and merge it into push
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config merge.fork-keys.name 'Merge translations and pubspec.lock by key'
          git config merge.fork-keys.driver 'node tool/fork_merge_driver.mjs %O %A %B %P'
          git remote add upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream main
          if ! git push origin upstream/main:refs/heads/main; then
            echo "::error title=main diverged::origin/main has commits that are not on upstream/main. Reset it to upstream/main."
            exit 1
          fi
          if ! git merge --no-edit -m "$MERGE_MESSAGE" upstream/main; then
            git merge --abort || true
            echo "::error title=Merge conflict::upstream/main conflicts with push. Merge it locally, resolve, and push."
            exit 1
          fi
          git push origin HEAD:push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: decide
        run: |
          last=$(git describe --tags --abbrev=0 --match '*-push.*' HEAD 2>/dev/null || true)
          if [ "${{ inputs.force }}" = "true" ]; then
            reason="forced"
          elif [ -z "$last" ]; then
            reason="no previous release"
          elif ! git diff --quiet "$last" HEAD -- . ':(exclude).github' ':(exclude).gitattributes' ':(exclude)FORK.md' ':(exclude)README.md' ':(exclude)tool/fork_merge_driver*'; then
            reason="changes since $last"
          else
            echo "Nothing changed since $last; not releasing."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Releasing: $reason"
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Merge upstream/main into push')) ||
      (needs.sync.result == 'success' && needs.sync.outputs.release == 'true'))
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.sync.outputs.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare failure reporting
        run: |
          cat > "$RUNNER_TEMP/run.sh" <<'EOF'
          #!/bin/bash
          title="$1"; shift
          log="$RUNNER_TEMP/$(echo "$title" | tr -c 'A-Za-z0-9' '_').log"
          if "$@" > "$log" 2>&1; then
            cat "$log"
            exit 0
          fi
          cat "$log"
          body=$({ grep -E 'error|Error|ERROR|What went wrong|FAILURE|Exception|^e: ' "$log" | head -n 40; echo '-----'; tail -n 40 "$log"; } | cut -c 1-300 | head -c 3500 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=$title failed::$body"
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/run.sh"

      - name: Set up the pinned Flutter SDK
        run: |
          sha=$(git ls-tree HEAD .flutter | awk '{print $3}')
          git clone --quiet --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout --quiet "$sha"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Get packages
        run: '"$RUNNER_TEMP/run.sh" "pub get" flutter pub get --enforce-lockfile'

      - name: Check formatting
        run: '"$RUNNER_TEMP/run.sh" "dart format" dart format --output=show --set-exit-if-changed .'

      - name: Analyze
        run: '"$RUNNER_TEMP/run.sh" "flutter analyze" flutter analyze'

      - name: Merge helper tests
        run: '"$RUNNER_TEMP/run.sh" "merge helper tests" node --test tool/fork_merge_driver.test.mjs'

      - name: Unit tests
        run: '"$RUNNER_TEMP/run.sh" "flutter test" flutter test'

      - name: Compute version
        id: version
        run: |
          base=$(grep -oP '^version: \K[^+]+' pubspec.yaml)
          code=$(grep -oP '^version: [^+]+\+\K[0-9]+' pubspec.yaml)
          if [ "$IS_RELEASE" = "true" ]; then
            n=$(( $(git tag --list "${base}-push.*" | wc -l) + 1 ))
          else
            n=0
          fi
          if [ "$n" -gt 99 ]; then
            echo "::error::More than 99 fork releases of upstream $base."
            exit 1
          fi
          name="${base}-push.${n}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$(( code * 100 + n ))" >> "$GITHUB_OUTPUT"
          echo "Version $name ($(( code * 100 + n )))"

      - name: Apply fork app ID and label
        run: |
          sed -i "s/applicationIdSuffix = \"\"/applicationIdSuffix = \"$APP_ID_SUFFIX\"/" android/app/build.gradle.kts
          grep -q "applicationIdSuffix = \"$APP_ID_SUFFIX\"" android/app/build.gradle.kts
          sed -i "s#<string name=\"label\">Obtainium</string>#<string name=\"label\">$APP_LABEL</string>#" android/app/src/main/res/values/string.xml
          grep -q "$APP_LABEL" android/app/src/main/res/values/string.xml

      - name: Set up signing
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "storeFile=$RUNNER_TEMP/release.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      - name: Build APK
        run: >-
          "$RUNNER_TEMP/run.sh" "flutter build" flutter build apk --release --flavor normal
          --build-name "${{ steps.version.outputs.name }}"
          --build-number "${{ steps.version.outputs.code }}"
          --dart-define=APP_VERSION=${{ steps.version.outputs.base }}

      - name: Verify signature
        if: env.IS_RELEASE == 'true'
        run: |
          apk=build/app/outputs/flutter-apk/app-normal-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if ! grep -qi "certificate SHA-256 digest: $SIGNER_SHA256" "$RUNNER_TEMP/certs.txt"; then
            echo "::error title=Wrong signing key::The APK is not signed with the expected key ($SIGNER_SHA256)."
            exit 1
          fi

      - name: Publish release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          BASE: ${{ steps.version.outputs.base }}
        run: |
          apk="obtainium-push.apk"
          mv build/app/outputs/flutter-apk/app-normal-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          {
            echo "Personal Obtainium build with push-triggered update checks."
            echo
            echo "- Based on upstream Obtainium $BASE"
            echo "- Fork commit: $(git rev-parse HEAD)"
            echo "- App ID: dev.imranr.obtainium$APP_ID_SUFFIX"
            echo "- Signing certificate SHA-256: $SIGNER_SHA256"
          } > notes.md
          gh release create "$NAME" "$apk" "$apk.sha256" --target "$(git rev-parse HEAD)" --title "$NAME" --notes-file notes.md

      - name: Notify this Obtainium
        if: env.IS_RELEASE == 'true'
        env:
          OBTAINIUM_PUSH_URL: ${{ secrets.OBTAINIUM_PUSH_URL }}
        run: |
          if [ -z "$OBTAINIUM_PUSH_URL" ]; then
            echo "OBTAINIUM_PUSH_URL is not set; skipping."
            exit 0
          fi
          curl -fsS -d "https://github.com/${{ github.repository }}" "$OBTAINIUM_PUSH_URL"
